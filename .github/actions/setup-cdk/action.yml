name: Set up CDK
description: Install the CDK CLI and backend dependencies
inputs:
  project-directory:
    description: Directory containing the backend Python project
    default: .
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: '3.13'
    - uses: actions/setup-node@v7
      with:
        node-version: '26'
    - name: Install dependencies
      shell: bash
      env:
        PROJECT_DIRECTORY: ${{ inputs.project-directory }}
      run: |
        python -m pip install -c "$GITHUB_ACTION_PATH/constraints.txt" "$PROJECT_DIRECTORY"
        npm install -g aws-cdk@2.1146.1
